# The InFormal desktop app. Kept out of the main workspace because Tauri
# needs the GTK / WebKitGTK development packages on Linux; build it from
# ui/ with `npm run tauri dev` or `npm run tauri build`.
[package]
name = "informal-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mayurkubavat/informal"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
informal-fpv = { path = "../../crates/informal-fpv" }
informal-engines-ext = { path = "../../crates/informal-engines-ext" }
informal-bmc = { path = "../../crates/informal-bmc" }
informal-liveness = { path = "../../crates/informal-liveness" }
informal-bitwuzla = { path = "../../crates/informal-bitwuzla" }
informal-llm = { path = "../../crates/informal-llm" }
informal-mcp = { path = "../../crates/informal-mcp" }
tokio = { version = "1", features = ["time"] }

# The external tools InFormal is built and tested with, one per line:
#   name  commit  upstream  artifact (relative to the tool's directory)
# Each tool is a git checkout in $INFORMAL_TOOLS_DIR/<name> (default
# ~/Silicon/DV/tools). scripts/tools.sh checks that every checkout is at its
# commit and built, and builds one that is missing or behind; scripts/check.sh
# runs the check, so a tool at another version fails the gate.
# Policy (docs/third-party.md): upstream as it is, no patches; a pin moves
# only with the checks listed there. Licenses and roles: docs/third-party.md.

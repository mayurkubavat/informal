[workspace]
resolver = "2"
members = ["crates/fdv-ir", "crates/fdv-engine", "crates/fdv-engines-ext", "crates/fdv-bench", "crates/fdv-tcl", "crates/fdv-fpv", "crates/fdv-sat", "crates/fdv-bmc", "crates/fdv-slang", "crates/fdv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
fdv-ir = { path = "crates/fdv-ir" }
fdv-engine = { path = "crates/fdv-engine" }
fdv-engines-ext = { path = "crates/fdv-engines-ext" }
fdv-bench = { path = "crates/fdv-bench" }
fdv-tcl = { path = "crates/fdv-tcl" }
fdv-fpv = { path = "crates/fdv-fpv" }
fdv-sat = { path = "crates/fdv-sat" }
fdv-bmc = { path = "crates/fdv-bmc" }
fdv-slang = { path = "crates/fdv-slang" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

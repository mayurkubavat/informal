[workspace]
resolver = "2"
members = ["crates/informal-ir", "crates/informal-engine", "crates/informal-engines-ext", "crates/informal-bench", "crates/informal-tcl", "crates/informal-fpv", "crates/informal-sat", "crates/informal-aig", "crates/informal-bmc", "crates/informal-svlang", "crates/informal-bitwuzla", "crates/informal-cli", "crates/informal-llm", "crates/informal-mcp", "crates/informal-upf", "crates/informal-trace", "crates/informal-session"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mayurkubavat/informal"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
informal-ir = { path = "crates/informal-ir" }
informal-engine = { path = "crates/informal-engine" }
informal-engines-ext = { path = "crates/informal-engines-ext" }
informal-bench = { path = "crates/informal-bench" }
informal-tcl = { path = "crates/informal-tcl" }
informal-fpv = { path = "crates/informal-fpv" }
informal-sat = { path = "crates/informal-sat" }
informal-aig = { path = "crates/informal-aig" }
informal-bmc = { path = "crates/informal-bmc" }
informal-svlang = { path = "crates/informal-svlang" }
svlang = { git = "https://github.com/mayurkubavat/svlang.git", tag = "v0.5.0" }
svlang-lint = { git = "https://github.com/mayurkubavat/svlang.git", tag = "v0.5.0" }
svlang-model = { git = "https://github.com/mayurkubavat/svlang.git", tag = "v0.5.0" }
informal-bitwuzla = { path = "crates/informal-bitwuzla" }
informal-llm = { path = "crates/informal-llm" }
informal-mcp = { path = "crates/informal-mcp" }
informal-upf = { path = "crates/informal-upf" }
informal-trace = { path = "crates/informal-trace" }
informal-session = { path = "crates/informal-session" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"


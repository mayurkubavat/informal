[workspace]
resolver = "2"
members = ["crates/informal-ir", "crates/informal-engine", "crates/informal-engines-ext", "crates/informal-bench", "crates/informal-tcl", "crates/informal-fpv", "crates/informal-sat", "crates/informal-aig", "crates/informal-bmc", "crates/informal-liveness", "crates/informal-bdd", "crates/informal-imc", "crates/informal-car", "crates/informal-ic3", "crates/informal-swarm", "crates/informal-svlang", "crates/informal-bitwuzla", "crates/informal-cli", "crates/informal-llm", "crates/informal-mcp", "crates/informal-upf", "crates/informal-liberty", "crates/informal-trace", "crates/informal-session", "crates/informal-app-conn", "crates/informal-app-csr", "crates/informal-app-protocol", "crates/informal-debug", "crates/informal-compat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mayurkubavat/informal"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
informal-ir = { path = "crates/informal-ir" }
informal-engine = { path = "crates/informal-engine" }
informal-engines-ext = { path = "crates/informal-engines-ext" }
informal-bench = { path = "crates/informal-bench" }
informal-tcl = { path = "crates/informal-tcl" }
informal-fpv = { path = "crates/informal-fpv" }
informal-sat = { path = "crates/informal-sat" }
informal-aig = { path = "crates/informal-aig" }
informal-bmc = { path = "crates/informal-bmc" }
informal-liveness = { path = "crates/informal-liveness" }
informal-bdd = { path = "crates/informal-bdd" }
informal-imc = { path = "crates/informal-imc" }
informal-car = { path = "crates/informal-car" }
informal-ic3 = { path = "crates/informal-ic3" }
informal-swarm = { path = "crates/informal-swarm" }
informal-svlang = { path = "crates/informal-svlang" }
svlang = { git = "https://github.com/mayurkubavat/svlang.git", rev = "a7501b4301a3c3a89b4b6d6ae3c6f0dce6cf7bc2" }
svlang-lint = { git = "https://github.com/mayurkubavat/svlang.git", rev = "a7501b4301a3c3a89b4b6d6ae3c6f0dce6cf7bc2" }
svlang-model = { git = "https://github.com/mayurkubavat/svlang.git", rev = "a7501b4301a3c3a89b4b6d6ae3c6f0dce6cf7bc2" }
informal-bitwuzla = { path = "crates/informal-bitwuzla" }
informal-llm = { path = "crates/informal-llm" }
informal-mcp = { path = "crates/informal-mcp" }
informal-upf = { path = "crates/informal-upf" }
informal-liberty = { path = "crates/informal-liberty" }
informal-trace = { path = "crates/informal-trace" }
informal-session = { path = "crates/informal-session" }
informal-app-conn = { path = "crates/informal-app-conn" }
informal-app-csr = { path = "crates/informal-app-csr" }
informal-app-protocol = { path = "crates/informal-app-protocol" }
informal-debug = { path = "crates/informal-debug" }
informal-compat = { path = "crates/informal-compat" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"


[workspace]
resolver = "2"
members = ["crates/informal-ir", "crates/informal-engine", "crates/informal-engines-ext", "crates/informal-bench", "crates/informal-tcl", "crates/informal-fpv", "crates/informal-sat", "crates/informal-aig", "crates/informal-bmc", "crates/informal-slang", "crates/informal-svlang", "crates/informal-bitwuzla", "crates/informal-cli", "crates/informal-llm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mayurkubavat/informal"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
informal-ir = { path = "crates/informal-ir" }
informal-engine = { path = "crates/informal-engine" }
informal-engines-ext = { path = "crates/informal-engines-ext" }
informal-bench = { path = "crates/informal-bench" }
informal-tcl = { path = "crates/informal-tcl" }
informal-fpv = { path = "crates/informal-fpv" }
informal-sat = { path = "crates/informal-sat" }
informal-aig = { path = "crates/informal-aig" }
informal-bmc = { path = "crates/informal-bmc" }
informal-slang = { path = "crates/informal-slang" }
informal-svlang = { path = "crates/informal-svlang" }
# Pinned by commit (docs/third-party.md).
svlang = { git = "https://github.com/mayurkubavat/svlang", rev = "508da05d0e75278474ba221c451fccb11360cf98" }
informal-bitwuzla = { path = "crates/informal-bitwuzla" }
informal-llm = { path = "crates/informal-llm" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"


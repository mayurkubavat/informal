# The designs of the comparison. Each case is one top module with the
# properties written in its SystemVerilog sources; every flow gets the same
# files. `group` says whose ground a design is: `informal`, `sby` and
# `ebmc` are each tool's own tests and examples, `neutral` is third-party
# RTL written for none of the three.
#
#   source   an entry of tools.toml, `sby-examples`, or `local` (this repository)
#   files    relative to the source's root
#   clock    the clock's name (default clk); reset: `rst` or `!rst_n`, or empty
#   glob     one case per matching file, top = the file's first module
#   sby_shipped  [file.sby, task]: SymbiYosys runs this script as shipped

# ---- InFormal's own tests ------------------------------------------------

[[case]]
# Every tests/sv design that has properties in the RTL and whose script is
# one clock and a reset. The `//=` lines give the expected answers.
name = "informal-tests"
group = "informal"
glob = "tests/sv/*.sv"
informal_test = true

[[case]]
# tests/fpv/counter with the script's properties in a bound module.
name = "informal-fpv/counter"
group = "informal"
files = ["tests/fpv/counter/counter.sv", "bench/compare/props/counter_props.sv"]
top = "counter"
reset = "!rst_n"

[[case]]
name = "informal-fpv/fifo"
group = "informal"
files = ["tests/fpv/fifo/fifo.sv", "bench/compare/props/fifo_props.sv"]
top = "fifo"
reset = "!rst_n"

# ---- SymbiYosys's examples -------------------------------------------------
# SymbiYosys runs each with the script that ships beside it. Its `read
# -formal` defines FORMAL, so the other flows get that define.

[[case]]
name = "sby-examples/fifo"
group = "sby"
source = "sby-examples"
files = ["fifo/fifo.sv"]
top = "fifo"
defines = ["FORMAL"]
sby_shipped = "fifo/fifo.sby"
sby_tasks = ["basic", "cover"]

[[case]]
name = "sby-examples/fifo-nofullskip"
group = "sby"
source = "sby-examples"
files = ["fifo/fifo.sv"]
top = "fifo"
defines = ["FORMAL", "NO_FULL_SKIP=1"]
sby_shipped = "fifo/fifo.sby"
sby_tasks = ["nofullskip"]


# OpenTitan primitives with a formal test bench (hw/ip/prim/fpv), written
# for a commercial tool. FPV_ON is the define its own flow sets. For
# SymbiYosys the YOSYS define selects the assertion macros OpenTitan
# provides for Yosys. InFormal is told to leave out the time-zero net
# checks (ASSERT_INIT_NET), which it does not model and reports unless
# told so; the switch is documented in docs/fpv-shell.md and off by default.

[[case]]
name = "opentitan/prim_arbiter_fixed"
source = "opentitan"
files = ["hw/ip/prim/rtl/prim_arbiter_fixed.sv", "hw/ip/prim/fpv/tb/prim_arbiter_fixed_tb.sv"]
incdirs = ["hw/ip/prim/rtl"]
top = "prim_arbiter_fixed_tb"
clock = "clk_i"
reset = "!rst_ni"
defines = ["FPV_ON"]
sby_defines = ["FPV_ON", "YOSYS"]
informal_setup = ["set_lowering skip_initial_checks on"]

